<meta property="og:type" content="website"><meta property="og:url" content="https://senor-inteligente.vercel.app/"><meta property="og:title" content="Señor Inteligente">

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{cursor:crosshair;display:block}
#crt{display:none;position:fixed;pointer-events:none;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.6))}
#crt.on{display:block}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch button{pointer-events:auto;position:absolute;width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.35);color:#fff;font:bold 12px monospace;bottom:calc(18px + env(safe-area-inset-bottom))}
body.gut #touch button{right:calc(12px + env(safe-area-inset-right))!important;width:66px;height:66px}
body.gut #touch button[data-k=grab]{bottom:calc(96px + env(safe-area-inset-bottom))}
body.gut #hint,body.port #hint{display:none}
body.port #touch button{width:74px;height:74px;bottom:calc(22px + env(safe-area-inset-bottom))}
#hint{position:fixed;left:14px;bottom:14px;color:#fff6;font:11px monospace;pointer-events:none}
</style></head><body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div><div id="crt"></div>
<div id="touch"><div id="hint">left: drag to move · right: drag to aim &amp; fire</div>
<button data-k="jump" style="right:16px">JUMP</button>
<button data-k="grab" style="right:90px">GRAB</button>
</div>
<script>window.TP_SPLIT=1</script><script src="trackpoint.js"></script><script src="game.js"></script>
<script>if('serviceWorker'in navigator&&!/embed=1/.test(location.search))navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body></html>
